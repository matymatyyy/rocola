name: Android

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Compilar APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK release
        run: |
          set -o pipefail
          ./gradlew assembleRelease --stacktrace 2>&1 | tee build.log

      - name: Marcar errores de compilación
        if: failure()
        run: python3 ci/annotate.py build.log

      - name: Revisar firma y contenido del APK
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          {
            "$BT/aapt2" dump badging "$APK" | head -30
            "$BT/apksigner" verify --verbose --print-certs "$APK"
            ls -la "$APK"
          } 2>&1 | tee apk-info.txt
          mkdir -p dist
          cp "$APK" dist/Rocola.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-output
          path: |
            dist/Rocola.apk
            build.log
            apk-info.txt
          if-no-files-found: warn

  emulator:
    name: Probar en emulador
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: build-output
          path: .

      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Generar canciones de prueba
        run: |
          which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          bash ci/make_fixtures.sh fixtures

      - name: Prueba en Android 14 (segundo plano, pantalla apagada, notificación)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          cores: 4
          ram-size: 4096M
          heap-size: 576M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -camera-back none -camera-front none
          script: bash ci/emulator-test.sh dist/Rocola.apk fixtures ci-out

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-report
          path: ci-out

  publish:
    name: Publicar resultados
    needs: [build, emulator]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out

      - name: Publicar APK y reporte en la versión "ci"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p assets
          [ -f out/build-output/dist/Rocola.apk ] && cp out/build-output/dist/Rocola.apk assets/
          [ -f out/build-output/build.log ] && cp out/build-output/build.log assets/
          [ -f out/build-output/apk-info.txt ] && cp out/build-output/apk-info.txt assets/
          if [ -d out/emulator-report ]; then
            (cd out/emulator-report && zip -qr ../../assets/reporte-emulador.zip .)
            [ -f out/emulator-report/resultado.txt ] && cp out/emulator-report/resultado.txt assets/
          fi
          ls -la assets
          gh release delete ci --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create ci assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Compilación de prueba" \
            --notes "Commit ${GITHUB_SHA::7}. Compilación: ${{ needs.build.result }}. Prueba en emulador: ${{ needs.emulator.result }}."
