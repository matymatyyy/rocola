name: Android

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilar APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK release
        run: ./gradlew assembleRelease --stacktrace

      - name: Revisar firma y contenido del APK
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/aapt2" dump badging "$APK" | head -30
          "$BT/apksigner" verify --verbose --print-certs "$APK"
          mkdir -p dist
          cp "$APK" dist/Rocola-1.0.apk
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: rocola-apk
          path: dist/Rocola-1.0.apk
          if-no-files-found: error

  emulator:
    name: Probar en emulador
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: rocola-apk
          path: dist

      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Generar canciones de prueba
        run: |
          which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          bash ci/make_fixtures.sh fixtures

      - name: Prueba en Android 14 (segundo plano, pantalla apagada, notificación)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -camera-back none -camera-front none
          script: bash ci/emulator-test.sh dist/Rocola-1.0.apk fixtures ci-out

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-report
          path: ci-out
